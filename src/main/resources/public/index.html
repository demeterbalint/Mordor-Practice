<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->

    <title>Mordor</title>

    <!-- Bootstrap css -->
    <link crossorigin="anonymous" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css"
          integrity="sha384-WskhaSGFgHYWDcbwN70/dfYBj47jz9qbsMId/iRN3ewGhXQFZCSftd1LZCfmhktB" rel="stylesheet">

    <!-- own css -->
    <link href="css/main.css" rel="stylesheet">

    <!-- font awesome -->
    <link crossorigin="anonymous" href="https://use.fontawesome.com/releases/v5.0.13/css/all.css"
          integrity="sha384-DNOHZ68U8hZfKXOrtjWvjxusGo9WQnrNx2sqG0tfsghAvtVlRW3tvkXWZh58N9jp" rel="stylesheet">

</head>
<body>

<!-- Fixed navbar -->
<nav class="navbar fixed-top navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="#" id="nav-index">Mordor Manager</a>
    <button aria-controls="navbar" aria-expanded="false" aria-label="Toggle navigation" class="navbar-toggler collapsed"
            data-target="#navbar" data-toggle="collapse" type="button">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="navbar-collapse collapse" id="navbar">
        <ul class="navbar-nav mr-auto mt-2 mt-lg-0">
            <li class="nav-item">
                <a class="nav-link" href="#" id="new-orc-link">New Orc</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" id="list-link">Orc list</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" id="new-horde-link">New Horde</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" id="horde-list-link">Horde List</a>
            </li>
        </ul>
    </div>
</nav>

<div aria-label="main" class="container theme-showcase" id="list-div">
    <h2>Orc list</h2>
    <table class="table table-striped" id="list-table">
        <thead class="thead-dark">
        <tr>
            <th>Id</th>
            <th>Orc name</th>
            <th>Race</th>
            <th>Kill count</th>
            <th>Weapons</th>
            <th>Horde</th>
            <th></th>
        </tr>
        </thead>
        <tbody id="list-table-body">
        <tr>
            <td>1</td>
            <td>Sample orc</td>
            <td>Some race</td>
            <td>500</td>
            <td>
                <ul>
                    <li>Some weapon</li>
                </ul>
            </td>
            <td>
                <button class="btn btn-sm btn-success" type="submit">Edit</button>
                <button class="btn btn-sm btn-danger" type="submit">Delete</button>
            </td>
            <td>Some horde</td>
        </tr>
        </tbody>
    </table>
</div>

<div class="container theme-showcase" id="orc-form-div" role="main">
    <h2>Orc form</h2>
    <form class="form-horizontal" id="orc-form">
        <input class="form-control" id="orc-id" type="hidden"/>

        <label for="orc-name">Name</label>
        <input class="form-control" id="orc-name" type="text"/>
        <br/>

        <label for="orc-race">Orc race</label>
        <select class="form-control" id="orc-race">
            <option value="foobar">Some race</option>
        </select>
        <br/>

        <label>Weapons</label><br/>
        <div id="orc-weapons">
            <input type="checkbox"/>A weapon<br/>
        </div>
        <br/>

        <label for="orc-kill-count">Number of kills</label>
        <input class="form-control" id="orc-kill-count" type="number"/>
        <br/>

        <label for="orc-horde-name">Horde name</label>
        <select class="form-control" id="orc-horde-name">
            <option value="foobar">Some horde</option>
        </select>
        <br>

        <button class="btn btn-success" id="orc-submit" type="submit">Submit</button>
    </form>
</div>

<div class="container theme-showcase" id="horde-form-div" role="main">
    <h2>Horde form</h2>
    <form class="form-horizontal" id="horde-form">
        <input class="form-control" id="horde-id" type="hidden"/>

        <label for="horde-name">Name</label>
        <input class="form-control" id="horde-name" type="text"/>
        <br/>

        <button class="btn btn-success" id="horde-submit" type="submit">Submit</button>
    </form>
</div>

<div class="container theme-showcase" id="horde-list-div" role="main">
    <h2>Horde list</h2>
    <table class="table table-striped" id="horde-list-table">
        <thead class="thead-dark">
        <tr>
            <th>Id</th>
            <th>Horde name</th>
            <th>Headcount</th>
            <th></th>
        </tr>
        </thead>
        <tbody id="horde-list-table-body">
        <tr>
            <td>1</td>
            <td>Sample horde</td>
            <td>500</td>
            <td>
                <button class="btn btn-sm btn-success" type="submit">Edit</button>
                <button class="btn btn-sm btn-danger" type="submit">Delete</button>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<br>
<div class="text-danger error-message" id="error-div"></div>

<!-- Bootstrap jquery, popper and js -->
<script crossorigin="anonymous"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script crossorigin="anonymous"
        integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
        src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"></script>
<script crossorigin="anonymous"
        integrity="sha384-smHYKdLADwkXOn1EmN1qk/HfnUcbVRZyYmZ4qpPea6sjB/pTJ0euyQp0Mk8ck+5T"
        src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/js/bootstrap.min.js"></script>

<!-- Own JavaScript -->
<script src="js/components.js"></script>
<script src="js/orcList.js"></script>
<script src="js/orcForm.js"></script>
<script src="js/events.js"></script>
<script src="js/hordeForm.js"></script>
<script src="js/hordeList.js"></script>

</body>
</html>
